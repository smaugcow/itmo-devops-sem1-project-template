services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: project-sem-1
      POSTGRES_USER: validator
      POSTGRES_PASSWORD: val1dat0r
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - prices_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validator -d project-sem-1"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    image: ${APP_IMAGE:-final-prices:local}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "${APP_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  prices_data:
